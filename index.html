<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Faith Shop | Futuristic Luxury</title>


<!-- Google Fonts (keep) -->

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet" />



<!-- KEEP all your custom styles -->

<style>

:root {
--rose-primary: #f472b6;
--neon-cyan: #22d3ee;
--luxury-bg: #fffafa;
--luxury-text: #0f172a;
}

.dark {
--luxury-bg: #020617;
--luxury-text: #f8fafc;
}

body {
font-family: 'Inter', sans-serif;
background-color: var(--luxury-bg);
color: var(--luxury-text);
overflow-x: hidden;
scroll-behavior: smooth;
transition: background-color 0.5s ease, color 0.5s ease;
}

.font-serif { font-family: 'Playfair Display', serif; }
.font-future { font-family: 'Space Grotesk', sans-serif; }

@property --angle {
syntax: '<angle>';
initial-value: 0deg;
inherits: false;
}

@keyframes rotate {
to { --angle: 360deg; }
}

.rotating-border-container {
position: relative;
padding: 3px;
border-radius: 9999px;
background: conic-gradient(from var(--angle), transparent, var(--rose-primary), var(--neon-cyan), transparent);
animation: rotate 4s linear infinite;
}

.glass {
background: rgba(255, 255, 255, 0.7);
backdrop-filter: blur(12px);
-webkit-backdrop-filter: blur(12px);
border: 1px solid rgba(255, 255, 255, 0.2);
}

.dark .glass {
background: rgba(15, 23, 42, 0.7);
border: 1px solid rgba(255, 255, 255, 0.05);
}

.amazon-grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
gap: 3rem;
}

.shadow-neon {
box-shadow: 0 0 15px var(--rose-primary), 0 0 30px var(--neon-cyan);
}

@media (max-width: 640px) {

.amazon-grid {
grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
gap: 1.5rem;
}

}

</style>


</head>

<body class="antialiased">

<div id="root"></div>


<!-- React entry -->

<script type="module" src="/index.tsx"></script>


</body>

</html>
